[project]
name = "webcan"
version = "0.3.0"
description = "Minimal stdlib-only threaded HTTP server"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["webcan"]

[tool.setuptools.package-dir]
"webcan" = "."